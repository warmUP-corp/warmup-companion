    <text x="942" y="78" font-size="15" text-anchor="end" letter-spacing="3" opacity=".54">LINK 09 // READY</text>
    <text x="58" y="540" font-size="14" letter-spacing="3" opacity=".48">AXIS VECTOR // 4CH</text>
    <text x="942" y="540" font-size="14" text-anchor="end" letter-spacing="3" opacity=".48">CONTROL BUS // 18</text>
  </g>

  <path d="M116 184 190 128 318 122 398 150H602L682 122 810 128 884 184 916 282 938 414 908 484 854 526 810 510 752 438 694 382 638 405H362L306 382 248 438 190 510 146 526 92 484 62 414 84 282Z" fill="#0f161e" stroke="#5ce8f2" stroke-width="7" stroke-linejoin="bevel"/>
  <path d="M116 184 190 128 318 122 398 150H602L682 122 810 128 884 184 916 282 938 414 908 484 854 526 810 510 752 438 694 382 638 405H362L306 382 248 438 190 510 146 526 92 484 62 414 84 282Z" fill="url(#micro-grid)"/>
  <path d="M102 292 130 207 204 154 307 149 360 172 328 226 231 244 174 294 146 414 110 454 87 415Z" fill="#18232d" stroke="#71818b" stroke-width="3"/>
  <path d="M898 292 870 207 796 154 693 149 640 172 672 226 769 244 826 294 854 414 890 454 913 415Z" fill="#18232d" stroke="#71818b" stroke-width="3"/>
  <path d="M342 156 402 136H598L658 156 628 242 596 264H404L372 242Z" fill="#0a1118" stroke="#5ce8f2" stroke-width="3"/>
  <path d="M420 292 500 270 580 292 600 356 560 390H440L400 356Z" fill="#121c25" stroke="#71818b" stroke-width="3"/>
