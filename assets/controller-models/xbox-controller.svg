    <g id="control-r3" data-control="r3" data-anchor="640,432">
      <title>Right stick</title>
      <circle cx="640" cy="432" r="64" fill="#0a1016" stroke="#5ce8f2" stroke-width="4"/>
      <circle cx="640" cy="432" r="39" fill="#19242d" stroke="#87949d" stroke-width="3"/>
      <path d="M640 376v14m0 84v14m-56-56h14m84 0h14" stroke="#ff5c70" stroke-width="3"/>
      <text x="640" y="440" font-size="22" fill="#d8fbff">R3</text>
