  <path d="M144 206h54l18-14h86M856 206h-54l-18-14h-86" fill="none" stroke="#ff5c70" stroke-width="3"/>

  <g id="control-grid" data-marker="control-grid" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
