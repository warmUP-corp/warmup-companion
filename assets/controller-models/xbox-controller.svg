    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5ce8f2" stroke-width="1" opacity=".08"/>
    </pattern>
  </defs>

  <g id="technical-grid" data-marker="technical-grid" fill="none" stroke="#5ce8f2">
