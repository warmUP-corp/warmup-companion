      <path d="m485 281 15 9 15-9-8 14 8 13-15-8-15 8 8-13Z" fill="none" stroke="#d8fbff" stroke-width="3"/>
    </g>
    <g id="control-touchpad" data-control="touchpad" data-anchor="500,360">
